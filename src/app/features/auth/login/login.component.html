<div class="login-wrapper">
  <div class="login-card">
    <div class="auth-header">
      <div class="logo">🍿 CineUTN</div>
      <h2>Iniciar Sesión</h2>
      <p class="subtitle">Ingresá a tu cuenta para gestionar tus reservas y combos</p>
    </div>
    
    @if (error) {
      <div class="error-msg">
        <span class="icon">⚠️</span>
        {{ error }}
      </div>
    }
    
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="ejemplo@correo.com" formControlName="email">
      </div>
      
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input id="password" type="password" placeholder="••••••••" formControlName="password">
      </div>
      
      <button type="submit" class="btn-submit" [disabled]="loginForm.invalid">Ingresar</button>
    </form>

    <div class="auth-footer">
      <p>¿No tenés cuenta aún? <a routerLink="/registro">Registrate aquí</a></p>
    </div>
  </div>
</div>
