<div class="dash-card full-width">
  <div class="card-header">
    <div class="title-container">
      <h3>Facturación Total</h3>
      <span class="badge-filter">{{ filtroActual }}</span>
    </div>
    <div class="dropdown">
      <button class="btn-dots">⋮</button>
      <div class="dropdown-menu">
        <span class="dropdown-subtitle">Filtro de tiempo</span>
        <button (click)="cargarGraficoFinanzas('dia')">Día</button>
        <button (click)="cargarGraficoFinanzas('semana')">Semana</button>
        <button (click)="cargarGraficoFinanzas('mes')">Mes</button>
        <button (click)="cargarGraficoFinanzas('año')">Año</button>
        <hr class="dropdown-divider">
        <span class="dropdown-subtitle">Exportar</span>
        <button (click)="exportar('pdf')">PDF</button>
        <button (click)="exportar('excel')">Excel</button>
      </div>
    </div>
  </div>
  <div class="card-body">
    <canvas id="finanzasChart"></canvas>
  </div>
</div>
