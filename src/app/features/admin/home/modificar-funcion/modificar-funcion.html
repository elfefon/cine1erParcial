<div class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Modificar Función</h2>
      <button class="btn-close" (click)="onCancel()">×</button>
    </div>

    <form [formGroup]="funcionForm" (ngSubmit)="onSubmit()" class="modal-body">
      <div class="form-grid">
        <div class="form-group full-width">
          <label for="pelicula_id_mod">Película</label>
          
          <!-- Select oculto para mantener la validación y el formGroup -->
          <select id="pelicula_id_mod" formControlName="pelicula_id" style="display: none;">
            <option value="">Seleccione una película</option>
            @for (p of peliculas; track p.id) {
              <option [value]="p.id">{{ p.nombre }}</option>
            }
          </select>

          <!-- Input con datalist (buscador nativo) -->
          <input type="text" 
                 placeholder="🔍 Escribe para buscar una película..." 
                 list="peliculas-list-mod"
                 [value]="getNombrePelicula(funcionForm.get('pelicula_id')?.value)"
                 (change)="onSeleccionarPeliculaList($event)">
                 
          <datalist id="peliculas-list-mod">
            @for (p of peliculas; track p.id) {
              <option [value]="p.nombre"></option>
            }
          </datalist>
        </div>

        <div class="form-group">
          <label for="horario">Horario</label>
          <input id="horario" type="datetime-local" formControlName="horario">
        </div>

        <div class="form-group">
          <label for="sala_id">Sala</label>
          <select id="sala_id" formControlName="sala_id">
            <option value="">Seleccione una sala</option>
            @for (s of salas; track s.id) {
              <option [value]="s.id">{{ s.nombre }} - {{ s.dimension }}</option>
            }
          </select>
        </div>

        <div class="form-group">
          <label for="idioma">Idioma</label>
          <select id="idioma" formControlName="idioma">
            <option value="">Seleccione idioma</option>
            <option value="Castellano">Castellano</option>
            <option value="Subtitulada">Subtitulada</option>
          </select>
        </div>

        <div class="form-group">
          <label for="formato">Formato (Automático)</label>
          <input id="formato" type="text" formControlName="formato">
        </div>

        <div class="form-group full-width">
          <label for="precio">Precio Base ($)</label>
          <input id="precio" type="number" formControlName="precio">
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-delete" (click)="onEliminar()">🗑️ Eliminar</button>
        <div class="footer-actions">
          <button type="button" class="btn-cancel" (click)="onCancel()">Cancelar</button>
          <button type="submit" class="btn-save" [disabled]="funcionForm.invalid">💾 Guardar Cambios</button>
        </div>
      </div>
    </form>
  </div>
</div>
