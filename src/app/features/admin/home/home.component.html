<div class="dashboard-metrics" style="display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap;">
  <div class="metric-card" style="background: var(--bg-card); padding: 20px; border-radius: 8px; flex: 1; min-width: 200px; border: 1px solid var(--border-color);">
    <h4 style="margin: 0; color: var(--text-muted);">Recaudado Hoy</h4>
    <p style="font-size: 2rem; font-weight: bold; margin: 10px 0 0; color: #10b981;">${{ totalRecaudado() }}</p>
  </div>
  <div class="metric-card" style="background: var(--bg-card); padding: 20px; border-radius: 8px; flex: 1; min-width: 200px; border: 1px solid var(--border-color);">
    <h4 style="margin: 0; color: var(--text-muted);">Total Entradas</h4>
    <p style="font-size: 2rem; font-weight: bold; margin: 10px 0 0; color: #3b82f6;">{{ totalEntradas() }}</p>
  </div>
  <div class="metric-card" style="background: var(--bg-card); padding: 20px; border-radius: 8px; flex: 1; min-width: 200px; border: 1px solid var(--border-color);">
    <h4 style="margin: 0; color: var(--text-muted);">Película Más Vista</h4>
    <p style="font-size: 1.5rem; font-weight: bold; margin: 10px 0 0; color: #f59e0b;">{{ peliculaMasVista() }}</p>
  </div>
</div>

<div class="dashboard-grid">
  <app-grafico-peliculas></app-grafico-peliculas>
  <app-grafico-candy></app-grafico-candy>
  <app-grafico-finanzas></app-grafico-finanzas>
</div>
