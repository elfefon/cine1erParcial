<div class="admin-layout">
  <aside class="sidebar">
    <a routerLink="/cartelera" class="sidebar-brand" style="text-decoration: none; color: inherit; cursor: pointer; display: flex; align-items: center; gap: 10px;">
      <span class="icon">🎬</span>
      <div>
        <h3 style="margin: 0;">CineUTN <span class="admin-badge">Admin</span></h3>
      </div>
    </a>

    <nav>
      <ul>
        <li>
          <a routerLink="home" routerLinkActive="active">
            <span>🏠</span> Home
          </a>
        </li>
        <li>
          <a routerLink="peliculas" routerLinkActive="active">
            <span>📹</span> Películas
          </a>
        </li>
        <li>
          <a routerLink="combos" routerLinkActive="active">
            <span>🍿</span> Candy (Combos)
          </a>
        </li>
        <li>
          <a routerLink="historial" routerLinkActive="active">
            <span>📋</span> Historial
          </a>
        </li>
        <li>
          <a routerLink="cupones" routerLinkActive="active">
            <span>🎟️</span> Cupones
          </a>
        </li>
      </ul>
    </nav>

    <button class="btn-logout" (click)="logout()">🔒 Cerrar Sesión</button>
  </aside>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
