<div class="page-header">
  <h2>Gestión de Próximamente (Pre-Ventas)</h2>
  <p>Acomodá la foto panorámica (Backdrop) que se mostrará en el Hero Slider.</p>
</div>
<div class="form-card" style="margin-top: 20px;">
  <h3>Configurar Foto Panorámica</h3>
  <form [formGroup]="preventaForm" (ngSubmit)="onSubmit()">
    <div class="form-grid">
      <div class="form-group full-width">
        <label>Película</label>
        <app-buscador-autocomplete
          listId="lista-preventas"
          placeholder="🔍 Escribe para buscar una película en preventa..."
          [opciones]="state.opcionesPreventas()"
          [seleccionId]="preventaForm.value.pelicula_id || ''"
          (seleccionChange)="onPeliculaSeleccionada($event)">
        </app-buscador-autocomplete>
      </div>
      <div class="form-group full-width">
        <label>URL de Imagen Apaisada</label>
        <input type="text" formControlName="imagen_apaisada_url">
      </div>
    </div>
    <button type="submit" class="btn-save" [disabled]="preventaForm.invalid">💾 Guardar Imagen</button>
  </form>
</div>
