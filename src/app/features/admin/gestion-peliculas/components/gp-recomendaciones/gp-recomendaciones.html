<div class="page-header">
  <h2>Gestión de Recomendadas</h2>
  <p>Agrega películas a tus recomendadas (máx 10).</p>
</div>
<div class="recomendaciones-container-new">
  <div class="form-card" style="margin-bottom: 30px;">
    <h3>Agregar a Recomendadas</h3>
    <div style="display: flex; gap: 10px; margin-top: 15px; align-items: center;">
      <app-buscador-autocomplete
        listId="lista-recomendadas"
        placeholder="🔍 Escribe para buscar una película..."
        [opciones]="state.opcionesRecomendadas()"
        [seleccionId]="recomendacionSeleccionada()"
        (seleccionChange)="recomendacionSeleccionada.set($event)">
      </app-buscador-autocomplete>
      <button class="btn-save" style="margin-top: 0; min-width: 100px;" (click)="agregarRecomendadaLocal()">Agregar</button>
    </div>
  </div>
  <div class="panel-recomendadas full-width-panel">
    <div class="panel-header"><h3>Películas Recomendadas ({{ state.recomendadasBorrador().length }}/10)</h3></div>
    <div class="swiper-preview large-swiper">
      @for (p of state.recomendadasBorrador(); track p.id) {
        <div class="preview-card-large">
          <img [src]="p.imagen_url" [alt]="p.nombre" class="preview-img">
          <button class="btn-remove large-remove" (click)="quitarDeRecomendadas(p)" title="Quitar">✖</button>
        </div>
      } @empty {
        <div class="empty-list" style="width: 100%; text-align: center; color: var(--text-muted); padding: 40px;">No hay películas recomendadas aún.</div>
      }
    </div>
  </div>
</div>
