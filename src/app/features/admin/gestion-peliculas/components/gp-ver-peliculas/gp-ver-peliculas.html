<div class="table-card">
  <h3>Películas Registradas</h3>
  <input type="text" class="search-bar" placeholder="Buscar película..." (input)="onBuscar($event)">
  <table class="data-table">
    <thead>
      <tr><th>Título</th><th>Sinopsis</th><th>Acciones</th></tr>
    </thead>
    <tbody>
      @for (p of peliculasTablaFiltradas(); track p.id) {
        <tr>
          <td style="font-weight: 700;">{{ p.nombre }}</td>
          <td style="color: var(--text-muted); max-width: 400px;">{{ p.sinopsis }}</td>
          <td>
            <div style="display: flex; gap: 5px;">
              <button class="btn-modificar" (click)="abrirModificar(p)">Editar</button>
              <button class="btn-remove" (click)="eliminar(p.id!)" style="padding: 5px 10px;">Eliminar</button>
            </div>
          </td>
        </tr>
      } @empty {
        <tr><td colspan="3" style="text-align: center; color: var(--text-muted); padding: 30px;">No hay películas en la base de datos.</td></tr>
      }
    </tbody>
  </table>
</div>

@if (peliculaEditando()) {
  <div class="modal-overlay">
    <div class="modal-content" style="max-width: 600px;">
      <div class="modal-header">
        <h3>Modificar Película</h3>
        <button class="btn-close" (click)="cerrarModificar()">✕</button>
      </div>
      <form [formGroup]="peliculaEditForm" (ngSubmit)="guardarModificacion()">
        <div class="form-grid">
          <div class="form-group full-width">
            <label>Título</label>
            <input type="text" formControlName="nombre">
          </div>
          <div class="form-group full-width">
            <label>Sinopsis</label>
            <textarea formControlName="sinopsis" rows="4"></textarea>
          </div>
          <div class="form-group">
            <label>Duración (minutos)</label>
            <input type="number" formControlName="duracion_min">
          </div>
        </div>
        <div class="modal-actions" style="margin-top: 20px;">
          <button type="submit" class="btn-save" [disabled]="peliculaEditForm.invalid">Guardar Cambios</button>
        </div>
      </form>
    </div>
  </div>
}
