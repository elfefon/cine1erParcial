<div class="cliente-layout">
  <header class="navbar">
    <div class="navbar-header">
      <a routerLink="/" class="brand" (click)="closeMobileMenu()">
        <span class="brand-icon">🍿</span>
        <span class="brand-title">Cine<span class="brand-highlight">UTN</span></span>
      </a>

      <button class="mobile-toggle" (click)="toggleMobileMenu()">
        <span>{{ isMobileMenuOpen() ? '✖' : '☰' }}</span>
      </button>
    </div>
    
    <div class="nav-container" [class.open]="isMobileMenuOpen()">
      <nav class="nav-links">
        <a routerLink="/cartelera" routerLinkActive="active" (click)="closeMobileMenu()">Cartelera</a>
        <a routerLink="/proximamente" routerLinkActive="active" (click)="closeMobileMenu()">Próximamente</a>
        <a routerLink="/candy" routerLinkActive="active" (click)="closeMobileMenu()">🍿 Candy</a>
      </nav>

      <div class="user-actions">
        <!-- Carrito pegado a la derecha, previsualiza plata -->
        <a routerLink="/carrito" routerLinkActive="active" class="cart-btn" (click)="closeMobileMenu()">
          🛒 Carrito <span class="cart-total" *ngIf="cart.totalGeneral() > 0">(${{ cart.totalGeneral() }})</span>
        </a>

        @if (authService.usuarioActual()) {
          <a routerLink="/mis-reservas" routerLinkActive="active" (click)="closeMobileMenu()">Mis Reservas</a>
          @if (authService.usuarioActual()?.rol === 'admin') {
            <a routerLink="/admin" style="color: var(--accent-gold);" (click)="closeMobileMenu()">Panel Admin</a>
          }
          <a routerLink="/perfil" class="profile-btn" (click)="closeMobileMenu()">👤</a>
        } @else {
          <a routerLink="/login" class="btn-login" (click)="closeMobileMenu()">Iniciar Sesión</a>
        }
      </div>
    </div>
  </header>

  <main class="content">
    <router-outlet></router-outlet>
  </main>

  <footer class="footer">
    <p>&copy; 2026 CineUTN - Todos los derechos reservados. Tu cine de confianza.</p>
  </footer>
</div>
