<div class="cliente-layout">
  <header class="navbar">
    <a routerLink="/" class="brand">
      <span class="brand-icon">🍿</span>
      <span class="brand-title">Cine<span class="brand-highlight">UTN</span></span>
    </a>
    
    <nav class="nav-links">
      <a routerLink="/cartelera" routerLinkActive="active">Cartelera</a>
      <a routerLink="/proximamente" routerLinkActive="active">Próximamente</a>
      <a routerLink="/candy" routerLinkActive="active">🍿 Candy</a>
    </nav>

    <div class="user-actions">
      <!-- Carrito pegado a la derecha, previsualiza plata -->
      <a routerLink="/carrito" routerLinkActive="active" class="cart-btn">
        🛒 Carrito <span class="cart-total" *ngIf="cart.totalGeneral() > 0">(${{ cart.totalGeneral() }})</span>
      </a>

      @if (authService.usuarioActual()) {
        <a routerLink="/mis-reservas" routerLinkActive="active">Mis Reservas</a>
        @if (authService.usuarioActual()?.rol === 'admin') {
          <a routerLink="/admin" style="color: var(--accent-gold);">Panel Admin</a>
        }
        <a routerLink="/perfil" class="profile-btn">👤</a>
      } @else {
        <a routerLink="/login" class="btn-login">Iniciar Sesión</a>
      }
    </div>
  </header>

  <main class="content">
    <router-outlet></router-outlet>
  </main>

  <footer class="footer">
    <p>&copy; 2026 CineUTN - Todos los derechos reservados. Tu cine de confianza.</p>
  </footer>
</div>
