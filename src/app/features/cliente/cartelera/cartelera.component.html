<div class="cartelera-container">
  <div class="cartelera-header">
    <h2>Películas en Cartelera</h2>
    <p>Descubrí los mejores estrenos y reservá tu lugar en CineUTN</p>
  </div>

  @if (peliculas().length > 0) {
    <div class="movies-grid">
      @for (p of peliculas(); track p.id) {
        <div class="movie-card">
          <div class="poster-wrapper">
            <img [src]="p.poster_url" [alt]="'Póster de ' + p.titulo" class="poster-img">
            <div class="poster-overlay"></div>
            <span class="badge-tag">En Cartelera</span>
          </div>
          
          <div class="card-body">
            <h3 class="card-title">{{ p.titulo }}</h3>
            <p class="card-sinopsis">{{ p.sinopsis | slice:0:110 }}...</p>
            <a [routerLink]="['/pelicula', p.id]" class="btn-details">Ver Detalles</a>
          </div>
        </div>
      }
    </div>
  } @else {
    <div class="empty-state">
      <div class="icon">🎬</div>
      <h3>No hay películas disponibles en este momento.</h3>
    </div>
  }
</div>
