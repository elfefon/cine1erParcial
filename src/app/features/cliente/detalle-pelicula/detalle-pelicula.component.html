@if (pelicula(); as p) {
  <div class="detalle-container">
    <a routerLink="/cartelera" class="back-link">
      <span>← Volver a Cartelera</span>
    </a>

    <div class="movie-detail-card">
      <div class="poster-box">
        <img [src]="p.poster_url" [alt]="'Póster de ' + p.titulo">
      </div>

      <div class="info-box">
        <h1 class="movie-title">{{ p.titulo }}</h1>

        <div class="movie-tags">
          <span class="tag tag-highlight">En Cartelera</span>
          <span class="tag">HD 4K</span>
          <span class="tag">Sonido Atmos</span>
        </div>

        <div class="section-title">Sinopsis</div>
        <p class="sinopsis">{{ p.sinopsis }}</p>

        <a [routerLink]="['/reserva', p.id]" class="btn-buy">
          <span>🎟️</span> Comprar Entradas
        </a>
      </div>
    </div>
  </div>
} @else {
  <div class="loading-box">
    <p>🍿 Cargando detalles de la película...</p>
  </div>
}
